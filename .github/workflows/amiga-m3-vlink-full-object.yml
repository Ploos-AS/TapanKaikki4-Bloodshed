name: Amiga M3 GNU ld vs vlink full object runtime

on:
  push:
    branches: [amiga-m3]
  pull_request:
    branches: [amiga-m2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-object-linker-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl p7zip-full unzip
      - name: Build identical full object probes with GNU ld and vlink
        run: |
          chmod +x ci/fs-uae/build-vlink-full-object-probe.sh
          ci/fs-uae/build-vlink-full-object-probe.sh
      - name: Run both probes inside AROS
        run: |
          chmod +x ci/fs-uae/*.sh
          ci/fs-uae/run-aros-vlink-full-object-probe.sh
      - name: Upload linker A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk4-m3-gnu-vlink-full-object
          path: |
            build-amiga-vlink-full/report.txt
            build-amiga-vlink-full/*-link.txt
            build/fs-uae/aros-m3-vlink-full/result.txt
            build/fs-uae/aros-m3-vlink-full/*/fs-uae.log
          if-no-files-found: warn
