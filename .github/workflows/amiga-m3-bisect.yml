name: Amiga M3 HUNK size bisection

on:
  push:
    branches: [amiga-m3]
  pull_request:
    branches: [amiga-m2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunk-size-bisect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl p7zip-full unzip

      - name: Build TK4 and HUNK size probes
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ozzyboshi/bebbo-amiga-gcc:latest \
            bash -lc '
              set -eux
              if ! command -v cmake >/dev/null 2>&1; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y cmake
              fi
              rm -rf build-amiga
              mkdir build-amiga
              cd build-amiga
              cmake .. \
                -DCMAKE_TOOLCHAIN_FILE=../cmake/amiga-toolchain.cmake \
                -DTK4_AMIGA=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DSDL_INCLUDE_DIR=/opt/amiga/m68k-amigaos/include/SDL \
                -DSDL_LIBRARY=/opt/amiga/m68k-amigaos/lib/libSDL.a \
                -DSDL_IMAGE_INCLUDE_DIR=/opt/amiga/SDL_image-pack/include/SDL \
                -DSDL_IMAGE_LIBRARY=/opt/amiga/SDL_image-pack/lib/libSDL_image.a \
                -DSDL_MIXER_INCLUDE_DIR=/opt/amiga/SDL_mixer/include \
                -DSDL_MIXER_LIBRARY=/opt/amiga/SDL_mixer/lib/libSDL_mixer.a
              cmake --build . -- -j2

              CC=/opt/amiga/bin/m68k-amigaos-gcc
              CXX=/opt/amiga/bin/m68k-amigaos-g++
              BASE="-m68020 -msoft-float -noixemul"

              : > tk4-hunk-size-report.txt
              echo "=== tk4 ===" >> tk4-hunk-size-report.txt
              stat -c "BYTES=%s" tk4 >> tk4-hunk-size-report.txt
              /opt/amiga/bin/m68k-amigaos-size -A tk4 >> tk4-hunk-size-report.txt || true

              for kib in 512 1024 1536 1792 2048; do
                bytes=$((kib * 1024))
                cat > "pad-${kib}.s" <<EOF
                .section .text
                .globl tk4_pad_${kib}
              tk4_pad_${kib}:
                .space ${bytes},0
EOF
                $CC $BASE -c "pad-${kib}.s" -o "pad-${kib}.o"
                $CXX $BASE \
                  -DPROBE_MARKER=\"SYS:save/m3-hunk-${kib}-main.txt\" \
                  -DPROBE_LABEL=\"HUNK_${kib}_MAIN=1\\n\" \
                  -c ../ci/fs-uae/tk4-object-probe.cpp -o "probe-${kib}-main.o"
                $CXX $BASE "probe-${kib}-main.o" "pad-${kib}.o" -o "tk4-hunk-${kib}-probe"
                echo "=== tk4-hunk-${kib}-probe ===" >> tk4-hunk-size-report.txt
                stat -c "BYTES=%s" "tk4-hunk-${kib}-probe" >> tk4-hunk-size-report.txt
                /opt/amiga/bin/m68k-amigaos-size -A "tk4-hunk-${kib}-probe" >> tk4-hunk-size-report.txt || true
                /opt/amiga/bin/m68k-amigaos-objdump -f "tk4-hunk-${kib}-probe" > "tk4-hunk-${kib}-probe-objdump.txt"
              done
              cat tk4-hunk-size-report.txt
            '

      - name: Run independent AROS HUNK size sweep
        run: |
          chmod +x ci/fs-uae/*.sh
          ci/fs-uae/run-aros-object-bisect.sh

      - name: Upload bisection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk4-amiga-m3-hunk-size-bisect
          path: |
            build-amiga/tk4-hunk-*-probe
            build-amiga/tk4-hunk-size-report.txt
            build-amiga/*-objdump.txt
            build/fs-uae/aros-m3-bisect/**
          if-no-files-found: warn
