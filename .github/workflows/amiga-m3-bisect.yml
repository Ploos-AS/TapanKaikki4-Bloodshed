name: Amiga M3 object isolation

on:
  push:
    branches: [amiga-m3]
  pull_request:
    branches: [amiga-m2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl p7zip-full unzip

      - name: Build TK4 object isolation probes
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ozzyboshi/bebbo-amiga-gcc:latest \
            bash -lc '
              set -eux
              if ! command -v cmake >/dev/null 2>&1; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y cmake
              fi
              rm -rf build-amiga
              mkdir build-amiga
              cd build-amiga
              cmake .. \
                -DCMAKE_TOOLCHAIN_FILE=../cmake/amiga-toolchain.cmake \
                -DTK4_AMIGA=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DSDL_INCLUDE_DIR=/opt/amiga/m68k-amigaos/include/SDL \
                -DSDL_LIBRARY=/opt/amiga/m68k-amigaos/lib/libSDL.a \
                -DSDL_IMAGE_INCLUDE_DIR=/opt/amiga/SDL_image-pack/include/SDL \
                -DSDL_IMAGE_LIBRARY=/opt/amiga/SDL_image-pack/lib/libSDL_image.a \
                -DSDL_MIXER_INCLUDE_DIR=/opt/amiga/SDL_mixer/include \
                -DSDL_MIXER_LIBRARY=/opt/amiga/SDL_mixer/lib/libSDL_mixer.a
              cmake --build . -- -j2

              CXX=/opt/amiga/bin/m68k-amigaos-g++
              BASE="-m68020 -msoft-float -noixemul"
              SDL_LIB=/opt/amiga/m68k-amigaos/lib/libSDL.a
              IMAGE_LIB=/opt/amiga/SDL_image-pack/lib/libSDL_image.a
              MIXER_LIB=/opt/amiga/SDL_mixer/lib/libSDL_mixer.a
              JPEG_LIB=/opt/amiga/SDL_image-pack/lib/libjpeg.a
              PNG_LIB=/opt/amiga/SDL_image-pack/lib/libpng.a
              Z_LIB=/opt/amiga/zlib-package/lib/libz.a
              LIBS="$IMAGE_LIB $MIXER_LIB $SDL_LIB $JPEG_LIB $PNG_LIB $Z_LIB -lpthread"

              TYPES_OBJ="CMakeFiles/tk4-common.dir/src/common/types.cpp.obj"
              test -f "$TYPES_OBJ"

              $CXX $BASE \
                -DPROBE_MARKER=\"SYS:save/m3-types-main.txt\" \
                -DPROBE_LABEL=\"TYPES_MAIN=1\\n\" \
                -c ../ci/fs-uae/tk4-object-probe.cpp -o types-main.o
              $CXX $BASE types-main.o "$TYPES_OBJ" libtk4-common.a $LIBS -o tk4-types-probe

              $CXX $BASE \
                -DPROBE_MARKER=\"SYS:save/m3-common-whole-main.txt\" \
                -DPROBE_LABEL=\"COMMON_WHOLE_MAIN=1\\n\" \
                -c ../ci/fs-uae/tk4-object-probe.cpp -o common-whole-main.o
              $CXX $BASE common-whole-main.o \
                -Wl,--whole-archive libtk4-common.a -Wl,--no-whole-archive \
                $LIBS -o tk4-common-whole-probe

              : > tk4-object-isolation-report.txt
              for bin in tk4-types-probe tk4-common-whole-probe tk4; do
                echo "=== $bin ===" >> tk4-object-isolation-report.txt
                stat -c "BYTES=%s" "$bin" >> tk4-object-isolation-report.txt
                /opt/amiga/bin/m68k-amigaos-size -A "$bin" >> tk4-object-isolation-report.txt || true
                /opt/amiga/bin/m68k-amigaos-objdump -f "$bin" > "$bin-objdump.txt" || true
                /opt/amiga/bin/m68k-amigaos-objdump -r "$bin" > "$bin-relocations.txt" || true
              done

              echo "=== types.cpp relocation count ===" >> tk4-object-isolation-report.txt
              /opt/amiga/bin/m68k-amigaos-objdump -r "$TYPES_OBJ" | grep -c "RELOC" >> tk4-object-isolation-report.txt || true
              cat tk4-object-isolation-report.txt
            '

      - name: Run independent AROS object probes
        run: |
          chmod +x ci/fs-uae/*.sh
          ci/fs-uae/run-aros-object-bisect.sh

      - name: Upload object isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk4-amiga-m3-object-isolation
          path: |
            build-amiga/tk4-types-probe
            build-amiga/tk4-common-whole-probe
            build-amiga/tk4-object-isolation-report.txt
            build-amiga/*-objdump.txt
            build-amiga/*-relocations.txt
            build/fs-uae/aros-m3-bisect/**
          if-no-files-found: warn
