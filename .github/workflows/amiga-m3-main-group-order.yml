name: Amiga M3 main executable group-order diagnostics

on:
  push:
    branches: [amiga-m3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-group-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl p7zip-full unzip

      - name: Build dependency-complete main-object order probes
        run: |
          docker run --rm -v "$PWD:/work" -w /work ozzyboshi/bebbo-amiga-gcc:latest bash -lc '
            set -euxo pipefail
            if ! command -v cmake >/dev/null 2>&1; then apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y cmake; fi
            rm -rf build-amiga build-amiga-main-groups
            mkdir build-amiga && cd build-amiga
            cmake .. -DCMAKE_TOOLCHAIN_FILE=../cmake/amiga-toolchain.cmake -DTK4_AMIGA=ON -DCMAKE_BUILD_TYPE=Release \
              -DSDL_INCLUDE_DIR=/opt/amiga/m68k-amigaos/include/SDL -DSDL_LIBRARY=/opt/amiga/m68k-amigaos/lib/libSDL.a \
              -DSDL_IMAGE_INCLUDE_DIR=/opt/amiga/SDL_image-pack/include/SDL -DSDL_IMAGE_LIBRARY=/opt/amiga/SDL_image-pack/lib/libSDL_image.a \
              -DSDL_MIXER_INCLUDE_DIR=/opt/amiga/SDL_mixer/include -DSDL_MIXER_LIBRARY=/opt/amiga/SDL_mixer/lib/libSDL_mixer.a
            cmake --build . -- -j2
            cd ..

            CXX=/opt/amiga/bin/m68k-amigaos-g++
            BASE="-m68020 -msoft-float -noixemul"
            LIBS="build-amiga/libtk4-common.a /opt/amiga/SDL_image-pack/lib/libSDL_image.a /opt/amiga/SDL_mixer/lib/libSDL_mixer.a /opt/amiga/m68k-amigaos/lib/libSDL.a /opt/amiga/SDL_image-pack/lib/libjpeg.a /opt/amiga/SDL_image-pack/lib/libpng.a /opt/amiga/zlib-package/lib/libz.a -lpthread"
            OUT=build-amiga-main-groups
            mkdir -p "$OUT"
            mapfile -t OBJECTS < <(find build-amiga/CMakeFiles/tk4.dir/src -type f -name "*.cpp.obj" ! -name "main.cpp.obj" | sort)
            test "${#OBJECTS[@]}" -gt 10
            n=${#OBJECTS[@]}
            q=$(( (n + 3) / 4 ))
            printf "%s\n" "${OBJECTS[@]}" > "$OUT/object-list.txt"
            printf "OBJECT_COUNT=%s\nQUARTILE_SIZE=%s\n" "$n" "$q" > "$OUT/layout.txt"
            : > "$OUT/manifest.tsv"

            build_probe() {
              label="$1"; shift
              marker="m3-main-group-${label}.txt"
              bin="main-group-${label}-probe"
              $CXX $BASE -DPROBE_MARKER=\"SYS:save/${marker}\" -DPROBE_LABEL=\"MAIN_GROUP_${label}=1\\n\" \
                -c ci/fs-uae/tk4-object-probe.cpp -o "$OUT/${label}-main.o"
              $CXX $BASE "$OUT/${label}-main.o" "$@" $LIBS -Wl,-Map="$OUT/${label}.map" -o "$OUT/$bin"
              printf "%s\t%s\t%s\t%s\n" "$label" "$label" "$bin" "$marker" >> "$OUT/manifest.tsv"
            }

            # Every probe contains the complete executable object set. Only order
            # changes, so all internal src/ dependencies remain resolved. Moving
            # quartiles to the end perturbs HUNK/relocation placement without
            # producing the unresolved-symbol skips seen in single-TU isolation.
            build_probe baseline "${OBJECTS[@]}"
            for part in 0 1 2 3; do
              start=$((part*q)); end=$((start+q)); [ "$end" -gt "$n" ] && end=$n
              [ "$start" -ge "$n" ] && continue
              front=(); moved=()
              for i in "${!OBJECTS[@]}"; do
                if [ "$i" -ge "$start" ] && [ "$i" -lt "$end" ]; then moved+=("${OBJECTS[$i]}"); else front+=("${OBJECTS[$i]}"); fi
              done
              label="q$((part+1))-last"
              printf "%s:" "$label" >> "$OUT/layout.txt"
              for x in "${moved[@]}"; do printf " %s" "${x#build-amiga/CMakeFiles/tk4.dir/src/}" >> "$OUT/layout.txt"; done
              printf "\n" >> "$OUT/layout.txt"
              build_probe "$label" "${front[@]}" "${moved[@]}"
            done
            # Stronger whole-set permutations; all src dependencies stay present.
            reversed=()
            for ((i=n-1; i>=0; i--)); do reversed+=("${OBJECTS[$i]}"); done
            build_probe reverse "${reversed[@]}"
            printf "reverse: complete object list reversed\\n" >> "$OUT/layout.txt"

            half=$(( (n + 1) / 2 ))
            build_probe halves-swapped "${OBJECTS[@]:$half}" "${OBJECTS[@]:0:$half}"
            printf "halves-swapped: second half followed by first half\\n" >> "$OUT/layout.txt"

            odd=(); even=()
            for i in "${!OBJECTS[@]}"; do
              if (( i % 2 )); then odd+=("${OBJECTS[$i]}"); else even+=("${OBJECTS[$i]}"); fi
            done
            build_probe odd-even "${odd[@]}" "${even[@]}"
            printf "odd-even: odd-index objects followed by even-index objects\\n" >> "$OUT/layout.txt"

            cat "$OUT/manifest.tsv"
            cat "$OUT/layout.txt"
          '
          sudo chown -R "$(id -u):$(id -g)" build-amiga-main-groups

      - name: Run dependency-complete order probes inside AROS
        run: |
          rm -rf build-amiga-main-objects
          cp -a build-amiga-main-groups build-amiga-main-objects
          chmod +x ci/fs-uae/*.sh
          OUT_DIR=build/fs-uae/aros-m3-main-group-order NATIVE_DIR=build-amiga-main-objects ci/fs-uae/run-aros-main-object-isolation.sh

      - name: Upload main group-order evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk4-m3-main-group-order
          path: |
            build-amiga-main-groups/manifest.tsv
            build-amiga-main-groups/object-list.txt
            build-amiga-main-groups/layout.txt
            build-amiga-main-groups/*.map
            build/fs-uae/aros-m3-main-group-order/result.txt
            build/fs-uae/aros-m3-main-group-order/*/result.txt
            build/fs-uae/aros-m3-main-group-order/*/fs-uae.log
          if-no-files-found: warn
