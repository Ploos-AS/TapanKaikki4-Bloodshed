name: Amiga M2 FS-UAE runtime

on:
  push:
    branches: [amiga-m2]
  pull_request:
    branches: [amiga-m1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fs-uae-aros-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip

      - name: Cross-build tk4 with Bebbo GCC
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ozzyboshi/bebbo-amiga-gcc:latest \
            bash -lc '
              set -eux
              if ! command -v cmake >/dev/null 2>&1; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y cmake
              fi
              rm -rf build-amiga
              mkdir build-amiga
              cd build-amiga
              cmake .. \
                -DCMAKE_TOOLCHAIN_FILE=../cmake/amiga-toolchain.cmake \
                -DTK4_AMIGA=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DSDL_INCLUDE_DIR=/opt/amiga/m68k-amigaos/include/SDL \
                -DSDL_LIBRARY=/opt/amiga/m68k-amigaos/lib/libSDL.a \
                -DSDL_IMAGE_INCLUDE_DIR=/opt/amiga/SDL_image-pack/include/SDL \
                -DSDL_IMAGE_LIBRARY=/opt/amiga/SDL_image-pack/lib/libSDL_image.a \
                -DSDL_MIXER_INCLUDE_DIR=/opt/amiga/SDL_mixer/include \
                -DSDL_MIXER_LIBRARY=/opt/amiga/SDL_mixer/lib/libSDL_mixer.a
              cmake --build . -- -j2
            '

      - name: Record native binary evidence
        run: |
          mkdir -p build/fs-uae/native
          cp build-amiga/tk4 build/fs-uae/native/tk4
          sha256sum build-amiga/tk4 | tee build/fs-uae/native/tk4.sha256
          file build-amiga/tk4 | tee build/fs-uae/native/file.txt

      - name: Execute tk4 inside AROS guest
        run: |
          chmod +x ci/fs-uae/*.sh
          ci/fs-uae/run-aros-guest-smoke.sh

      - name: Upload M2 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk4-amiga-m2-fs-uae
          path: |
            build/fs-uae/native/tk4
            build/fs-uae/native/tk4.sha256
            build/fs-uae/native/file.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-guest/result.txt
            build/fs-uae/aros-guest/fs-uae.log
            build/fs-uae/aros-guest/fs-uae-version.txt
            build/fs-uae/aros-guest/aros-guest.fs-uae
            build/fs-uae/aros-guest/system-root/**/tk4-m2-*.txt
          if-no-files-found: warn
