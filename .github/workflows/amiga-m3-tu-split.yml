name: Amiga M3 translation-unit split diagnostics

on:
  push:
    branches: [amiga-m3]
    paths:
      - '.github/workflows/amiga-m3-tu-split.yml'
      - 'src/common/CSteam.h'
      - 'src/common/CCoord.h'
      - 'src/common/CLinkedList.h'
      - 'ci/fs-uae/tk4-object-probe.cpp'
      - 'ci/fs-uae/run-aros-tu-perturbation.sh'
  workflow_dispatch:

# M3 header/inheritance bisect.  The previous constructor matrix showed that
# even the method-stub-only CSteam object fails before main.  This matrix
# isolates the include chain, especially CCoord's C++ stream headers.
jobs:
  tu-split:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl p7zip-full unzip

      - name: Build CSteam header and inheritance bisect probes
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work ozzyboshi/bebbo-amiga-gcc:latest bash -lc '
            set -euxo pipefail
            if ! command -v cmake >/dev/null 2>&1; then apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y cmake; fi
            rm -rf build-amiga-tu-base build-amiga-tu-out
            mkdir build-amiga-tu-base build-amiga-tu-out
            cd build-amiga-tu-base
            cmake .. -DCMAKE_TOOLCHAIN_FILE=../cmake/amiga-toolchain.cmake -DTK4_AMIGA=ON -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-m68020 -msoft-float -noixemul" \
              -DSDL_INCLUDE_DIR=/opt/amiga/m68k-amigaos/include/SDL -DSDL_LIBRARY=/opt/amiga/m68k-amigaos/lib/libSDL.a \
              -DSDL_IMAGE_INCLUDE_DIR=/opt/amiga/SDL_image-pack/include/SDL -DSDL_IMAGE_LIBRARY=/opt/amiga/SDL_image-pack/lib/libSDL_image.a \
              -DSDL_MIXER_INCLUDE_DIR=/opt/amiga/SDL_mixer/include -DSDL_MIXER_LIBRARY=/opt/amiga/SDL_mixer/lib/libSDL_mixer.a
            cmake --build . --target tk4-common -- -j2
            cd ..
            CXX=/opt/amiga/bin/m68k-amigaos-g++; AR=/opt/amiga/bin/m68k-amigaos-ar
            BASE="-m68020 -msoft-float -noixemul"
            INC="-Isrc -Isrc/common -I/opt/amiga/m68k-amigaos/include/SDL -I/opt/amiga/SDL_image-pack/include/SDL -I/opt/amiga/SDL_mixer/include"
            LIBS="/opt/amiga/SDL_image-pack/lib/libSDL_image.a /opt/amiga/SDL_mixer/lib/libSDL_mixer.a /opt/amiga/m68k-amigaos/lib/libSDL.a /opt/amiga/SDL_image-pack/lib/libjpeg.a /opt/amiga/SDL_image-pack/lib/libpng.a /opt/amiga/zlib-package/lib/libz.a -lpthread"
            : > build-amiga-tu-out/manifest.tsv

            steam_member="$($AR t build-amiga-tu-base/libtk4-common.a | grep "CSteam.cpp.obj" | head -n1)"
            steamio_member="$($AR t build-amiga-tu-base/libtk4-common.a | grep "CSteamIO.cpp.obj" | head -n1)"
            test -n "$steam_member"; test -n "$steamio_member"
            cp build-amiga-tu-base/libtk4-common.a build-amiga-tu-out/libtk4-common-nosteam.a
            $AR d build-amiga-tu-out/libtk4-common-nosteam.a "$steam_member" "$steamio_member"

            cat > build-amiga-tu-out/probe-control.cpp <<"EOF"
int tk4_header_probe_control(void) { return 0; }
EOF
            cat > build-amiga-tu-out/probe-linked.cpp <<"EOF"
#include "CLinkedList.h"
int tk4_header_probe_linked(void) { return (int)sizeof(CLinkedList<int>); }
EOF
            cat > build-amiga-tu-out/probe-iostream.cpp <<"EOF"
#include <iostream>
int tk4_header_probe_iostream(void) { return 0; }
EOF
            cat > build-amiga-tu-out/probe-sstream.cpp <<"EOF"
#include <sstream>
int tk4_header_probe_sstream(void) { return 0; }
EOF
            cat > build-amiga-tu-out/probe-coord.cpp <<"EOF"
#include "CCoord.h"
int tk4_header_probe_coord(void) { return (int)sizeof(CCoord<float>); }
EOF
            cat > build-amiga-tu-out/probe-steam-header.cpp <<"EOF"
#include "CSteam.h"
int tk4_header_probe_steam(void) { return (int)sizeof(CSteam); }
EOF
            cat > build-amiga-tu-out/probe-methods.cpp <<"EOF"
#include "CSteam.h"
void CSteam::ReadFromFile(FILE *, int) {}
void CSteam::WriteToFile(FILE *) {}
EOF

            for variant in control linked iostream sstream coord steam-header methods; do
              src="build-amiga-tu-out/probe-${variant}.cpp"
              obj="build-amiga-tu-out/probe-${variant}.obj"
              one="build-amiga-tu-out/lib-header-bisect-${variant}.a"
              $CXX $BASE $INC -c "$src" -o "$obj"
              $AR rcs "$one" "$obj"
              marker="m3-tu-header-bisect-${variant}-main.txt"
              mainobj="build-amiga-tu-out/header-bisect-${variant}-main.o"
              bin="build-amiga-tu-out/header-bisect-${variant}-probe"
              trace="build-amiga-tu-out/header-bisect-${variant}-trace.txt"
              $CXX $BASE -DPROBE_MARKER=\"SYS:save/${marker}\" -DPROBE_LABEL=\"TU_HEADER_BISECT_${variant}_MAIN=1\\n\" -c ci/fs-uae/tk4-object-probe.cpp -o "$mainobj"
              $CXX $BASE "$mainobj" -Wl,-t -Wl,--whole-archive "$one" -Wl,--no-whole-archive build-amiga-tu-out/libtk4-common-nosteam.a $LIBS -Wl,-Map="build-amiga-tu-out/header-bisect-${variant}.map" -o "$bin" >"$trace" 2>&1
              printf "header-bisect\t%s\t%s\n" "$variant" "$marker" >> build-amiga-tu-out/manifest.tsv
            done

            {
              for variant in control linked iostream sstream coord steam-header methods; do
                echo "=== ${variant}: object symbols ==="
                /opt/amiga/bin/m68k-amigaos-nm -a "build-amiga-tu-out/probe-${variant}.obj" | grep -E "ioinit|GLOBAL|static_initialization|tk4_header_probe|CSteam" || true
                echo "=== ${variant}: linker trace ==="
                cat "build-amiga-tu-out/header-bisect-${variant}-trace.txt"
                echo "=== ${variant}: common archive members present in map ==="
                grep -F "libtk4-common-nosteam.a(" "build-amiga-tu-out/header-bisect-${variant}.map" | sed -n "1,160p" || true
                echo
              done
            } > build-amiga-tu-out/header-bisect-report.txt
          '
          sudo chown -R "$(id -u):$(id -g)" build-amiga-tu-*
          cat build-amiga-tu-out/header-bisect-report.txt

      - name: Inspect HUNK layouts
        run: |
          : > build-amiga-tu-out/hunk-report.txt
          for f in build-amiga-tu-out/*-probe; do
            echo "=== $f ===" | tee -a build-amiga-tu-out/hunk-report.txt
            python3 tools/amiga_hunk_inspect.py "$f" | tee -a build-amiga-tu-out/hunk-report.txt
          done

      - name: Run header bisect probes on AROS
        run: |
          chmod +x ci/fs-uae/*.sh
          ci/fs-uae/run-aros-tu-perturbation.sh

      - name: Upload TU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk4-m3-tu-layout-perturbation
          path: |
            build-amiga-tu-out/*
            build/fs-uae/aros-m3-tu/result.txt
            build/fs-uae/aros-m3-tu/*/result.txt
            build/fs-uae/aros-m3-tu/*/fs-uae.log
          if-no-files-found: warn
