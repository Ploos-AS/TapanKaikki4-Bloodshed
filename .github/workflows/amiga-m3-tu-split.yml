name: Amiga M3 translation-unit split diagnostics

on:
  push:
    branches:
      - amiga-m3
    paths:
      - '.github/workflows/amiga-m3-tu-split.yml'
      - 'ci/fs-uae/build-csteam-constructor-bisect.sh'
      - 'ci/fs-uae/tk4-object-probe.cpp'
      - 'ci/fs-uae/run-aros-tu-perturbation.sh'
      - 'src/common/CSteam.h'
      - 'src/common/CCoord.h'
      - 'src/common/CLinkedList.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csteam-header-bisect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl p7zip-full unzip

      - name: Build CSteam header dependency bisect probes
        run: |
          chmod +x ci/fs-uae/build-csteam-constructor-bisect.sh
          ci/fs-uae/build-csteam-constructor-bisect.sh

      - name: Inspect bisect probe HUNK layouts
        run: |
          : > build-amiga-tu-out/hunk-report.txt
          for f in build-amiga-tu-out/*-probe; do
            echo "=== $f ===" | tee -a build-amiga-tu-out/hunk-report.txt
            python3 tools/amiga_hunk_inspect.py "$f" | tee -a build-amiga-tu-out/hunk-report.txt
          done

      - name: Run header dependency bisect probes inside AROS
        run: |
          chmod +x ci/fs-uae/*.sh
          ci/fs-uae/run-aros-tu-perturbation.sh

      - name: Upload header dependency bisect diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk4-m3-csteam-header-bisect
          path: |
            build-amiga-tu-out/*
            build/fs-uae/aros-m3-tu/result.txt
            build/fs-uae/aros-m3-tu/*/result.txt
            build/fs-uae/aros-m3-tu/*/fs-uae.log
          if-no-files-found: warn
