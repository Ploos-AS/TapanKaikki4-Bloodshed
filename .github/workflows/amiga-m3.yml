name: Amiga M3 playable baseline

on:
  push:
    branches: [amiga-m3]
  pull_request:
    branches: [amiga-m2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fs-uae-aros-playable-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip

      - name: Cross-build tk4 with Bebbo GCC
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ozzyboshi/bebbo-amiga-gcc:latest \
            bash -lc '
              set -eux
              if ! command -v cmake >/dev/null 2>&1; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y cmake
              fi
              rm -rf build-amiga
              mkdir build-amiga
              cd build-amiga
              cmake .. \
                -DCMAKE_TOOLCHAIN_FILE=../cmake/amiga-toolchain.cmake \
                -DTK4_AMIGA=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DSDL_INCLUDE_DIR=/opt/amiga/m68k-amigaos/include/SDL \
                -DSDL_LIBRARY=/opt/amiga/m68k-amigaos/lib/libSDL.a \
                -DSDL_IMAGE_INCLUDE_DIR=/opt/amiga/SDL_image-pack/include/SDL \
                -DSDL_IMAGE_LIBRARY=/opt/amiga/SDL_image-pack/lib/libSDL_image.a \
                -DSDL_MIXER_INCLUDE_DIR=/opt/amiga/SDL_mixer/include \
                -DSDL_MIXER_LIBRARY=/opt/amiga/SDL_mixer/lib/libSDL_mixer.a
              cmake --build . -- -j2
              /opt/amiga/bin/m68k-amigaos-gcc -m68020 -msoft-float -noixemul ../ci/fs-uae/loader-probe.c -o loader-probe
              /opt/amiga/bin/m68k-amigaos-g++ -m68020 -msoft-float -noixemul ../ci/fs-uae/cxx-init-probe.cpp -o cxx-init-probe
              /opt/amiga/bin/m68k-amigaos-g++ -m68020 -msoft-float -noixemul \
                -I/opt/amiga/m68k-amigaos/include/SDL \
                ../ci/fs-uae/sdl-startup-probe.cpp \
                /opt/amiga/m68k-amigaos/lib/libSDL.a -lpthread \
                -o sdl-startup-probe
              /opt/amiga/bin/m68k-amigaos-objdump -f tk4 > tk4-objdump.txt
              /opt/amiga/bin/m68k-amigaos-objdump -f loader-probe > loader-probe-objdump.txt
              /opt/amiga/bin/m68k-amigaos-objdump -f cxx-init-probe > cxx-init-probe-objdump.txt
              /opt/amiga/bin/m68k-amigaos-objdump -f sdl-startup-probe > sdl-startup-probe-objdump.txt

              : > tk4-static-init-report.txt
              echo "=== TK4 object files with pre-main/static initializers ===" | tee -a tk4-static-init-report.txt
              while IFS= read -r obj; do
                syms="$(/opt/amiga/bin/m68k-amigaos-nm -C "$obj" 2>/dev/null | grep -E "_GLOBAL__sub_I|__static_initialization_and_destruction_0|\.ctors|\.init_array" || true)"
                if [ -n "$syms" ]; then
                  echo "OBJECT=$obj" | tee -a tk4-static-init-report.txt
                  printf "%s\n" "$syms" | tee -a tk4-static-init-report.txt
                fi
              done < <(find CMakeFiles/tk4.dir CMakeFiles/tk4-common.dir -type f \( -name "*.obj" -o -name "*.o" \) | sort)
              echo "=== Linked executable static-init symbols ===" | tee -a tk4-static-init-report.txt
              /opt/amiga/bin/m68k-amigaos-nm -C tk4 2>/dev/null | grep -E "_GLOBAL__sub_I|__static_initialization_and_destruction_0" | tee -a tk4-static-init-report.txt || true
              cat tk4-static-init-report.txt
            '

      - name: Execute playable-baseline gate inside AROS guest
        run: |
          chmod +x ci/fs-uae/*.sh
          ci/fs-uae/run-aros-playable-smoke.sh

      - name: Upload M3 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk4-amiga-m3-playable-baseline
          path: |
            build-amiga/tk4
            build-amiga/loader-probe
            build-amiga/cxx-init-probe
            build-amiga/sdl-startup-probe
            build-amiga/*-objdump.txt
            build-amiga/tk4-static-init-report.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-m3/result.txt
            build/fs-uae/aros-m3/fs-uae.log
            build/fs-uae/aros-m3/fs-uae-version.txt
            build/fs-uae/aros-m3/aros-guest.fs-uae
            build/fs-uae/aros-m3/system-root/**/tk4-m3-*.txt
            build/fs-uae/aros-m3/system-root/**/save/m3-*.txt
          if-no-files-found: warn
